
<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qisada - QISOOYIN</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3845/3845868.png">

    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --primary-color: #2ecc71;
            --header-bg: #2c3e50;
            --header-text: #ffffff;
            --footer-bg: #2c3e50;
            --footer-text: #bdc3c7;
        } 

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f4f7f6;
            --card-bg: #2d2d2d;
            --primary-color: #2ecc71;
            --header-bg: #111111;
            --header-text: #ffffff;
            --footer-bg: #111111;
            --footer-text: #888888;
        } 

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        } 

        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        } 

        header h1 {
            margin: 0;
            font-size: 32px;
        } 

        .back-btn, .dark-mode-btn {
            background: none;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 20px;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        } 

        .back-btn:hover, .dark-mode-btn:hover {
            background-color: var(--primary-color);
            color: white;
        } 

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        } 

        .qiso-full-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        } 

        .qiso-banner-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        } 

        .qiso-full-card-content {
            padding: 40px;
        } 

        .qiso-full-card h2 {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 36px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        } 

        .qiso-content {
            font-size: 19px;
            line-height: 1.8;
            margin-top: 20px;
            white-space: pre-line;
        } 

        footer {
            background-color: var(--footer-bg);
            color: var(--footer-text);
            text-align: center;
            padding: 20px;
            font-size: 16px;
            margin-top: 40px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }
    </style>
</head>
<body> 

    <header>
        <a href="index.html" class="back-btn">⬅ Dib u laabo</a>
        <h1>📖 QISOOYIN</h1>
        <button class="dark-mode-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </header> 

    <div class="container">
        <div class="qiso-full-card">
            <img id="qisoBanner" src="" alt="Qiso Banner" class="qiso-banner-img" style="display: none;">
            
            <div class="qiso-full-card-content">
                <h2 id="qisoTitle">Soo raraya...</h2>
                <div class="qiso-content" id="qisoBody">
                    Fadlan sug, qisada waa la soo rarayaa...
                </div>
            </div>
        </div>
    </div> 

    <footer>
        &copy; <span id="year"></span> QISOOYIN - Xuquuqda wey dhowran tahay
    </footer> 

    <script>
        const database = {
    "samirka-iyo-guusha": {
        title: "Samirka iyo Guusha",
        image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
        content: "Waqti hore, waxaa jiray nin dhalinyaro ah oo rabay..."
    },
    "dhabada-toosan": {
        title: "Dhabada Toosan",
        image: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80",
        content: "Daacadnimadu waa dhabada ka kaliya..."
    },
    "aamina-iyo-riyadeeda": {
        title: "Aamina iyo Riyadeeda",
        image: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=800&q=80",
        content: "Aamina waxay ahayd gabadh dhalinyaro ah..."
    },
    "nuurkii-indhaheyga": {
        title: "Nuurkii Indhaheyga (Aragtida Gabadha)",
        image: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=800&q=80",
        content: "Sumaya waxay ahayd gabadh aad u jecel..."
    },
    "qoraalkii-ugu-dambeeyey": {
        title: "Qoraalkii Ugu Dambeeyey (Aragtida Wiilka)",
        image: "https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?auto=format&fit=crop&w=800&q=80",
        content: "Khaalid wuxuu ahaa wiil dabeecad deggan..."
    },
    "jidka-tareenka-iyo-kulankii-qaddarka": {
        title: "Jidka Tareenka iyo Kulankii Qaddarka",
        image: "https://images.unsplash.com/photo-1474487548417-781cb71495f3?auto=format&fit=crop&w=800&q=80",
        content: "Cumar iyo Fardowsa waxay ahaayeen laba qof..."
    },
    "boqorkii-barafka": {
        title: "Boqorkii Barafka",
        image: "https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?auto=format&fit=crop&w=800&q=80",
        content: "Sheekada Boqorkii Barafka: Sheeko ka timid Dhaqanka iyo Dhaxalka Ruushka...\n\nWaagii hore, waxaa jiray qoys Ruush ah oo ka koobnaa hooyo, aabbe, iyo gabadh qurux badan. Hooyadii way dhimatay, aabbahana waxaa lagu qasbay inuu dib u guursado...\n\nXaaskan cusub waxay lahayd gabadh la da'a ah. Xaasku waxay si joogto ah u canaanan jirtay gabadha ninkeeda. Habeen qabow oo jiilaal ah, waxay ninkeeda ku tiri: 'U kaxee gabadhaada beeraha waaweyn oo halkaas uga soo tag.'\n\nNinkii ayaa gabadhiisa geyay beeraha barafka ah. Boqorkii Barafka ayaa arkay gabadhii, wuxuuna ka helay naxariisteeda iyo edebteeda. Wuxuu siiyay sanduuq ka buuxa dahab iyo dhar qaali ah.\n\nMarkay gurigii ku soo laabatay isagoo hodan ah, hooyadii badayd waxay u dirtay gabadheedii iyada ahayd iyadoo rajaynaysa inay hanti soo hesho. Laakiin gabadhii waxay ku jawaabtay si edeb darro ah, Boqorkii Barafka ayaana barafeeyay ilaa ay ka dhimatay.\n\nHooyadii waxay ogaatay in xaasidnimadeeda ay dhasheeda ku dhibtay."
    }
};


        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("year").innerText = new Date().getFullYear();

            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.querySelector('.dark-mode-btn').innerText = "☀️ Light Mode";
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.querySelector('.dark-mode-btn').innerText = "🌙 Dark Mode";
            } 

            const urlParams = new URLSearchParams(window.location.search);
            const qisoId = urlParams.get('id'); 

            if (qisoId && database[qisoId]) {
                document.getElementById('qisoTitle').innerText = database[qisoId].title;
                document.getElementById('qisoBody').innerText = database[qisoId].content;
                document.title = database[qisoId].title + " - QISOOYIN";
                
                const banner = document.getElementById('qisoBanner');
                banner.src = database[qisoId].image;
                banner.style.display = "block";
            } else {
                document.getElementById('qisoTitle').innerText = "Qisada lama helin!";
                document.getElementById('qisoBody').innerText = "Waan ka xunnahay, qisadan laguma hayo diiwaanka.";
            }
        }); 

        function toggleDarkMode() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                document.querySelector('.dark-mode-btn').innerText = "🌙 Dark Mode";
                localStorage.setItem("theme", "light");
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.querySelector('.dark-mode-btn').innerText = "☀️ Light Mode";
                localStorage.setItem("theme", "dark");
            }
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('Service Worker Error: ', err));
            });
        }
    </script> 
</body>
</html>
